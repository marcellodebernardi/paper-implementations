[project]
name = "paper-implementations"
version = "0.1.0"
description = "Collection of AI, ML and robotics paper reproducibility work"
readme = "README.md"
authors = [
    { name = "Marcello De Bernardi", email = "marcello.logins@outlook.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.1",
    "wandb>=0.30.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.7",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
