[project]
name = "paper-implementations"
version = "0.1.0"
description = "Collection of AI, ML and robotics paper reproducibility work"
readme = "README.md"
authors = [
    { name = "Marcello De Bernardi", email = "marcello.logins@outlook.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "wandb>=0.30.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.7",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
